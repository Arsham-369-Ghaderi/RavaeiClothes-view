      <stop offset="0.6" stop-color="#F7EBE4"/>
      <stop offset="1" stop-color="#F3DDD8"/>
    </linearGradient>
    <radialGradient id="blushA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1100 40) rotate(90) scale(320)">
